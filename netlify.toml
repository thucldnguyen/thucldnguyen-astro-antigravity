[build]
  command = "npm run build"
  publish = "dist"

# Disable Netlify's automatic image optimization
# Let Astro handle all image processing
[images]
  remote_images = []

# Default: short cache for HTML pages (later rules override for specific paths)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-lived cache for hashed static assets (immutable)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts: 1 day cache
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, immutable"

# Service worker files: never cache so browser always gets latest version.
# TEMPORARY: remove after 2026-04-01.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache llms.txt files for 1 day
[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"

# Redirect sitemap.xml to sitemap-index.xml
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

